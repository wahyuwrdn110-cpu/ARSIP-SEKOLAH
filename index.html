<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arsip Sekolah – Drive</title>
<style>
:root{--page:#2563c9;--shell:#fff;--side:#1f5bc4;--soft:#f0f3fa;--tx:#1d2a44;--mu:#7b879f;--pr:#2563c9;--bd:#e6eaf3;--ok:#16a34a;--sel:#e3edff;--wn:#b45309;--wb:#fff4dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0c1a3a;--shell:#141c2e;--side:#1b4aa8;--soft:#1d2740;--tx:#e8eefb;--mu:#93a0bb;--pr:#6d9bff;--bd:#27324b;--sel:#22345e;--wn:#fbbf24;--wb:#3a2f12;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0c1a3a;--shell:#141c2e;--side:#1b4aa8;--soft:#1d2740;--tx:#e8eefb;--mu:#93a0bb;--pr:#6d9bff;--bd:#27324b;--sel:#22345e;--wn:#fbbf24;--wb:#3a2f12;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--tx);font-family:'Inter','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.btn{border:0;background:var(--pr);color:#fff;padding:.7rem 1.2rem;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn.gh{background:var(--soft);color:var(--pr)}.btn:disabled{opacity:.6}
input,select,textarea{width:100%;padding:.65rem .85rem;border:1px solid var(--bd);border-radius:10px;background:var(--soft)}
label{display:block;font-size:.8rem;font-weight:600;margin:.8rem 0 .3rem;color:var(--mu)}
.mu{color:var(--mu)}.sm{font-size:.82rem}
#auth{min-height:100vh;display:grid;place-items:center;padding:1rem}
.box{background:var(--shell);border-radius:24px;padding:2rem;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.25rem;color:var(--pr)}
.lg{width:36px;height:36px;border-radius:10px;background:var(--pr);display:grid;place-items:center;color:#fff}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin:1.2rem 0 .4rem}
.tabs button{border:0;background:transparent;padding:.55rem;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mu)}
.tabs .on{background:var(--shell);color:var(--pr);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.note{background:var(--wb);color:var(--wn);border-radius:10px;padding:.6rem .8rem;font-size:.78rem;margin-top:.9rem}
.shell{max-width:1120px;margin:1.2rem auto;background:var(--shell);border-radius:28px;overflow:hidden;display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;min-height:calc(100vh - 2.4rem);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem}
.topbar .brand{width:216px}
.search{flex:1;max-width:420px;border-radius:999px!important;padding-left:1.1rem!important}
.user{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--mu)}
.av{width:34px;height:34px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.side{background:var(--side);color:#fff;border-top-right-radius:60px;padding:1.4rem 1.1rem;display:flex;flex-direction:column;gap:.3rem}
.side .up{background:#fff;color:var(--pr);border:0;border-radius:999px;padding:.7rem;font-weight:700;cursor:pointer;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.nav{border:0;background:transparent;color:#cfe0ff;text-align:left;padding:.65rem .8rem;border-radius:10px;cursor:pointer;font-size:.92rem;display:flex;align-items:center;gap:.7rem}
.nav.on{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.stor{margin-top:auto;font-size:.75rem;color:#cfe0ff}
.stor .b{height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin:.3rem 0 .6rem}.stor .b i{display:block;height:100%;background:#fff;border-radius:4px}
.stor em{display:block;font-style:normal;color:#fff;word-break:break-all;margin-bottom:.6rem}
.out{border:0;background:transparent;color:#fff;cursor:pointer;padding:.4rem 0;font-size:.85rem;display:flex;align-items:center;gap:.5rem}
main{padding:.5rem 1.8rem 2rem;overflow:auto}
h1{font-size:1.5rem;color:var(--pr);margin:.3rem 0 1rem}
h4{font-size:.72rem;letter-spacing:.12em;color:var(--mu);margin:1.6rem 0 .8rem;text-transform:uppercase}
.rule{border-top:1px solid var(--bd);margin-bottom:1rem}
.qa,.acts{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fold{background:var(--soft);border-radius:16px;padding:1rem;cursor:pointer;transition:.15s;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:.5rem}
.fold:hover,.fold.hot{background:var(--pr);color:#fff;transform:translateY(-3px)}
.fold small{font-size:.65rem;letter-spacing:.1em;opacity:.7}.fold b{display:flex;align-items:center;gap:.5rem;font-size:.92rem}.fold span{font-size:.75rem;opacity:.8}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-size:.65rem;letter-spacing:.1em;color:var(--mu);text-align:left;padding:.5rem .6rem;text-transform:uppercase;font-weight:600}
td{padding:.7rem .6rem;border-top:1px solid var(--bd);white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover td{background:var(--sel)}
.fi{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;margin-right:.7rem;vertical-align:middle}
.fi.p{background:#ffe9c7;color:#b45309}.fi.k{background:#d9f3df;color:#15803d}
.pill{padding:.15rem .6rem;border-radius:999px;font-size:.7rem;font-weight:700;background:var(--sel);color:var(--pr)}
.bar{height:6px;width:70px;background:var(--bd);border-radius:6px;display:inline-block;vertical-align:middle;margin-right:.4rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tw{overflow-x:auto}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}.filters>*{flex:1;min-width:150px}
.card{background:var(--soft);border-radius:18px;padding:1.3rem;max-width:580px}
.steps{display:flex;gap:.4rem;margin-bottom:1rem}.steps span{flex:1;font-size:.72rem;text-align:center;padding:.4rem;border-radius:8px;background:var(--bd);color:var(--mu)}.steps .on{background:var(--pr);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.7rem}
.seg button{border:2px solid var(--bd);background:var(--shell);border-radius:14px;padding:1rem;cursor:pointer;text-align:left}
.seg button:hover{border-color:var(--pr)}.seg b{display:flex;align-items:center;gap:.5rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:1rem}
.acc{background:var(--shell);border:1px solid var(--bd);border-radius:14px;padding:.8rem}
.acc small{font-size:.65rem;letter-spacing:.1em;color:var(--mu);display:block}.acc b{font-size:.85rem;word-break:break-all}
.acc.ok{border-color:var(--ok)}
.path{font-family:ui-monospace,Menlo,monospace;background:#e3f5e7;color:#15632e;padding:.5rem .8rem;border-radius:10px;font-size:.8rem;margin-top:.8rem}
.row{display:flex;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(8,14,30,.6);display:grid;place-items:center;padding:1rem;z-index:15}
#modal .card{background:var(--shell);width:100%;max-width:500px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:.8rem 1.3rem;border-radius:12px;z-index:20;font-weight:600;max-width:90%;display:flex;gap:.5rem;align-items:center}
@media(max-width:760px){.shell{grid-template-columns:1fr;margin:0;border-radius:0;min-height:100vh}.topbar{grid-column:1}.topbar .brand{width:auto}.search,.user span{display:none}
.side{border-radius:0;flex-direction:row;overflow-x:auto;padding:.6rem}.side .up,.stor{display:none}.nav{white-space:nowrap}main{padding:.5rem 1rem 2rem}.two{grid-template-columns:1fr}}
.sh,.ib{display:none}.fold b{overflow-wrap:anywhere}
@media(min-width:761px) and (max-width:1000px){.shell{grid-template-columns:200px 1fr;margin:.6rem auto}.topbar .brand{width:176px}main{padding:.5rem 1.2rem 2rem}.qa,.acts{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media(max-width:760px){
body{background:var(--shell)}
.shell{min-height:100dvh;box-shadow:none}
.topbar{flex-wrap:wrap;gap:.6rem;padding:.8rem 1rem .4rem;position:sticky;top:env(safe-area-inset-top,0px);background:var(--shell);z-index:6}
.topbar .brand{flex:1;font-size:1.1rem}
.user{margin-left:0}.ib{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:var(--soft);color:var(--pr);cursor:pointer}
.search{display:block;order:3;flex-basis:100%;max-width:none}
.side{position:fixed;left:0;right:0;bottom:0;z-index:10;flex-direction:row;justify-content:space-around;gap:0;padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;overflow:visible;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.nav{flex:1;flex-direction:column;gap:.15rem;align-items:center;justify-content:center;padding:.45rem .2rem;font-size:.68rem;text-align:center;min-height:52px}
.nav .ic{width:1.4em;height:1.4em;margin:0}.nav .lb{display:none}.nav .sh{display:block}
main{padding:.3rem 1rem calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:1.25rem}
input,select,textarea{font-size:16px}
.btn{min-height:44px}.row .btn{flex:1}
.card{padding:1rem}.steps span{font-size:.65rem;padding:.35rem .2rem}.seg{grid-template-columns:1fr}
.two,.acts,.qa{grid-template-columns:1fr}.qa{grid-template-columns:1fr 1fr}
.filters>*{flex:1 1 100%}
table,tbody{display:block}thead{display:none}
tr.r{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .7rem;padding:.8rem;border:1px solid var(--bd);border-radius:14px;margin-bottom:.6rem;background:var(--shell)}
tr.r td{padding:0;border:0;white-space:normal;background:none!important}
tr.r td:first-child{flex-basis:100%;font-weight:600}
#modal{place-items:end center;padding:0}
#modal .card{max-width:none;border-radius:22px 22px 0 0;max-height:88dvh;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.box{padding:1.5rem 1.2rem}
}
</style></head><body>

<section id="auth"><div class="box">
<div class="brand"><div class="lg"><span data-i="cloud"></span></div>Arsip Sekolah</div>
<p class="mu sm" style="margin:1.2rem 0 .2rem">Masuk untuk mengelola arsip kegiatan sekolah.</p>

<label id="le">Email akun</label><input id="ue" type="email" placeholder="nama@sekolah.sch.id">
<label>Kata sandi</label><input id="up" type="password" placeholder="Minimal 6 karakter" onkeydown="if(event.key==='Enter')submitAuth()">

<div class="row"><button class="btn" id="ab" style="width:100%" onclick="submitAuth()">Masuk</button></div>
<p class="mu sm">Login admin lokal: wahyuwrdn110@gmail.com · kata sandi: admin123</p>
</div></section>

<div id="app" class="shell hide">
<div class="topbar"><div class="brand"><div class="lg"><span data-i="cloud"></span></div>Arsip Drive</div>
<input class="search" id="gq" placeholder="Cari arsip…" oninput="gsearch()">
<div class="user"><span id="who"></span><div class="av" id="av"></div><button class="ib" onclick="logout()" aria-label="Keluar" data-i="logout"></button></div></div>
<aside class="side">
<button class="up" onclick="go('add')"><span data-i="plus"></span>Tambah Arsip Baru</button>
<button class="nav on" data-v="dash"><span data-i="home"></span><span class="lb">Halaman Utama</span><span class="sh">Utama</span></button>
<button class="nav" data-v="add"><span data-i="upload"></span><span class="lb">Tambah Arsip Baru</span><span class="sh">Tambah</span></button>
<button class="nav" data-v="find"><span data-i="search"></span><span class="lb">Cari &amp; Lihat Arsip</span><span class="sh">Cari</span></button>
<button class="nav" data-v="settings"><span data-i="settings"></span><span class="lb">Pengaturan</span><span class="sh">Atur</span></button>
<div class="stor"><b>EMAIL DRIVE PENYIMPANAN</b><em id="sde">Belum terhubung</em><div class="b"><i id="sb" style="width:10%"></i></div><span id="st"></span>
<button class="out" onclick="logout()" style="margin-top:.8rem"><span data-i="logout"></span>Keluar</button></div>
</aside>
<main>
<section id="dash"></section><section id="add" class="hide"></section><section id="settings" class="hide"></section>
<section id="find" class="hide"><h1>Cari &amp; Lihat Arsip</h1><div class="rule"></div>
<div class="filters"><select id="fy" onchange="render()"></select>
<select id="fc" onchange="render()"><option value="">Semua kategori</option><option value="Pembangunan">Pembangunan</option><option value="Kegiatan_Sekolah">Kegiatan Sekolah</option></select></div>
<div class="tw"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Tanggal</th><th>Foto / Progres</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main></div>

<div id="modal" class="hide" onclick="if(event.target===this)closeM()"><div class="card" id="mb"></div></div>
<div id="toast" class="hide"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $=id=>document.getElementById(id);
const SHARED_MODE=!!(window.google&&google.script&&google.script.run);
let AUTH_TOKEN='';
const P={cloud:'<path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z"/>',plus:'<path d="M12 5v14M5 12h14"/>',home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',upload:'<path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',logout:'<path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/>',folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',build:'<path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/>',cap:'<path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',dl:'<path d="M12 4v12m0 0-4-4m4 4 4-4M4 20h16"/>',check:'<path d="m5 12 5 5 9-10"/>',save:'<path d="M5 3h11l3 3v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/>',back:'<path d="m12 19-7-7 7-7M5 12h14"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=ic(e.dataset.i)});
const seed=[{id:1,kind:'Pembangunan',nm:'Renovasi Ruang Kelas 7A',dt:'2025-08-12',ds:'Perbaikan atap, lantai, dan pengecatan ulang.',pr:70,n:4},
{id:2,kind:'Kegiatan_Sekolah',nm:'Upacara HUT RI ke-80',dt:'2025-08-17',ds:'Upacara bendera dan lomba antar kelas.',pr:null,n:12},
{id:3,kind:'Kegiatan_Sekolah',nm:'Wisuda Angkatan 2024',dt:'2024-06-20',ds:'Pelepasan siswa kelas 9 di aula sekolah.',pr:null,n:30},
{id:4,kind:'Pembangunan',nm:'Pembangunan Laboratorium IPA',dt:'2024-03-05',ds:'Gedung lab baru dua lantai.',pr:100,n:9}];
const DEFAULT_ADMIN_EMAIL='wahyuwrdn110@gmail.com';
let CONFIG={adminEmail:DEFAULT_ADMIN_EMAIL,googleClientId:'',driveEmail:''};
let DB=seed,users=[],kind='',me=null;
try{
const savedConfig=localStorage.getItem('ars_config');if(savedConfig)CONFIG={...CONFIG,...JSON.parse(savedConfig)};
const savedDB=localStorage.getItem('arsip4');if(savedDB)DB=JSON.parse(savedDB);
users=JSON.parse(localStorage.getItem('ars_users')||'[]')
}catch(e){console.error('Gagal membaca data aplikasi dari browser.',e)}
let admin=users.find(u=>u.isAdmin||u.email===DEFAULT_ADMIN_EMAIL);
if(!admin){admin={name:'Admin Sekolah',email:CONFIG.adminEmail,pass:'admin123',isAdmin:true,drive:CONFIG.driveEmail};users.unshift(admin)}
admin.email=CONFIG.adminEmail;admin.isAdmin=true;admin.drive=CONFIG.driveEmail||'';
const persist=()=>{try{localStorage.setItem('arsip4',JSON.stringify(DB));localStorage.setItem('ars_users',JSON.stringify(users));localStorage.setItem('ars_config',JSON.stringify(CONFIG));return true}catch(e){console.error('Gagal menyimpan data aplikasi di browser.',e);toast('Penyimpanan browser penuh atau tidak tersedia.',1);return false}};
const yr=d=>d.slice(0,4),lab=k=>k==='Pembangunan'?'Pembangunan':'Kegiatan Sekolah',okMail=s=>/^\S+@\S+\.\S+$/.test(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Registrasi & Login (akun aplikasi) */
function submitAuth(){const e=$('ue').value.trim().toLowerCase(),p=$('up').value;
if(!okMail(e))return toast('Format email tidak valid',1);if(p.length<6)return toast('Sandi minimal 6 karakter',1);
const u=users.find(x=>x.email===e&&x.pass===p);if(!u)return toast('Email atau sandi salah',1);
me=u;$('who').textContent=u.name;$('av').textContent=u.name[0].toUpperCase();$('auth').classList.add('hide');$('app').classList.remove('hide');go('dash')}
function logout(){if(SHARED_MODE){if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();AUTH_TOKEN='';location.reload();return}me=null;$('app').classList.add('hide');$('auth').classList.remove('hide');$('up').value=''}

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v,f){['dash','add','find','settings'].forEach(x=>$(x).classList.toggle('hide',x!==v));
document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
if(v==='dash')dash();if(v==='add')addView();if(v==='settings')settingsView();if(v==='find'){years();if(f){$('fy').value=f.y||'';$('fc').value=f.k||''}render()}
const n=DB.reduce((a,x)=>a+x.n,0);$('sb').style.width=Math.min(95,10+n)+'%';$('st').textContent=n+' foto tersimpan';
$('sde').textContent=me.drive||'Belum terhubung';window.scrollTo(0,0)}

/* Email Drive penyimpanan (terpisah dari akun login) */
function accounts(){const driveLabel=SHARED_MODE?'Drive bersama sekolah':(me.drive||'Belum terhubung');return `<div class="two"><div class="acc"><small>AKUN LOGIN</small><b>${ic('user')} ${esc(me.email)}</b></div>
<div class="acc ${SHARED_MODE||me.drive?'ok':''}"><small>DRIVE PENYIMPANAN</small><b>${ic('cloud')} ${esc(driveLabel)}</b></div></div>`}
function driveForm(){return `<b>Hubungkan Google Drive</b><p class="mu sm">Login Google akan meminta izin untuk membuat folder dan menyimpan berkas arsip ke Drive akun yang Anda pilih. Email Drive boleh berbeda dari email admin.</p>
<div class="row"><button class="btn" id="cn" onclick="connect()">${ic('link')}${me.drive?'Ganti akun Google Drive':'Login &amp; hubungkan Drive'}</button></div>`}
function getGoogleToken(promptAccount){
return new Promise((resolve,reject)=>{
if(!CONFIG.googleClientId)return reject(new Error('Isi Google OAuth Client ID pada Pengaturan terlebih dahulu.'));
if(!window.google||!google.accounts||!google.accounts.oauth2)return reject(new Error('Layanan login Google belum termuat. Periksa koneksi internet lalu muat ulang halaman.'));
const client=google.accounts.oauth2.initTokenClient({client_id:CONFIG.googleClientId,scope:'openid email https://www.googleapis.com/auth/drive.file',
callback:r=>r.error?reject(new Error(r.error_description||r.error)):resolve(r.access_token),
error_callback:e=>reject(new Error(e.message||'Login Google dibatalkan atau gagal.'))});
client.requestAccessToken({prompt:promptAccount?'select_account':'',login_hint:CONFIG.driveEmail||undefined})
})
}
async function connectedGoogleAccount(promptAccount){
const token=await getGoogleToken(promptAccount);
const response=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+token}});
if(!response.ok)throw new Error('Tidak dapat membaca akun Google. Pastikan izin email disetujui.');
const account=await response.json();
if(!account.email)throw new Error('Google tidak mengembalikan alamat email akun.');
return {token,email:account.email.toLowerCase()}
}

const b=$('cn');if(b){b.disabled=true;b.textContent='Menghubungkan…'}
try{const account=await connectedGoogleAccount(true);CONFIG.driveEmail=account.email;admin.drive=account.email;if(me.isAdmin)me.drive=account.email;if(!persist()){if(b){b.disabled=false;b.innerHTML=ic('link')+'Coba hubungkan lagi'}return}toast('Google Drive terhubung: '+account.email);const v=$('add').classList.contains('hide')?'settings':'add';go(v)}
catch(e){console.error('Koneksi Google Drive gagal.',e);toast(e.message||'Koneksi Google Drive gagal.',1);if(b){b.disabled=false;b.innerHTML=ic('link')+'Coba hubungkan lagi'}}
}

 $('settings').innerHTML=`<h1>Pengaturan</h1><div class="rule"></div>${accounts()}

function saveSettings(){
if(SHARED_MODE){saveSharedSettings();return}
const email=$('adminEmail').value.trim().toLowerCase(),clientId=$('googleClientId').value.trim();
if(!okMail(email))return toast('Masukkan email administrator yang valid.',1);
if(clientId&&!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(clientId))return toast('Format Google OAuth Client ID tidak valid.',1);
const oldEmail=CONFIG.adminEmail;CONFIG.adminEmail=email;CONFIG.googleClientId=clientId;
admin.email=email;admin.isAdmin=true;users.forEach(u=>{if(u.email===oldEmail&&u.isAdmin)u.email=email});
if(me.isAdmin){me.email=email;$('who').textContent=email;$('av').textContent=email[0].toUpperCase()}
if(!persist())return;toast('Pengaturan berhasil disimpan.');settingsView()
}
async function saveSharedSettings(){
const email=$('adminEmail').value.trim().toLowerCase();
const authorizedEmails=$('authorizedEmails').value.split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);
if(!okMail(email)||authorizedEmails.some(x=>!okMail(x)))return toast('Periksa email admin dan daftar email guru.',1);
try{
const result=await rpc('updateSharedSettings',AUTH_TOKEN,{adminEmail:email,authorizedEmails});
CONFIG.adminEmail=result.adminEmail;CONFIG.authorizedEmails=result.authorizedEmails;me.isAdmin=result.isAdmin;
toast('Pengaturan admin dan akses guru berhasil disimpan.');settingsView()
}catch(e){toast(e.message||'Gagal memperbarui pengaturan bersama.',1)}
}
function disconnectDrive(){CONFIG.driveEmail='';admin.drive='';if(me.isAdmin)me.drive='';if(persist())settingsView()}

/* Halaman Utama */
const ico=x=>`<span class="fi ${x.kind==='Pembangunan'?'p':'k'}">${ic(x.kind==='Pembangunan'?'build':'cap')}</span>`;
function dash(){const ys=[...new Set(DB.map(x=>yr(x.dt)))].sort().reverse().slice(0,3),fo=[];
ys.forEach(y=>['Pembangunan','Kegiatan_Sekolah'].forEach(k=>{const c=DB.filter(x=>yr(x.dt)===y&&x.kind===k).length;if(c)fo.push([y,k,c])}));
$('dash').innerHTML=`<h1>Halaman Utama</h1><div class="rule"></div>${accounts()}
<div class="acts"><div class="fold hot" onclick="go('add')"><small>MENU 1</small><b>${ic('plus')}Tambah Arsip Baru</b><span>Unggah dokumentasi ke Google Drive</span></div>
<div class="fold" onclick="go('find')"><small>MENU 2</small><b>${ic('search')}Cari &amp; Lihat Arsip</b><span>Filter tahun / kategori</span></div></div>
<h4>Quick Access</h4><div class="qa">${fo.slice(0,4).map(([y,k,c])=>`<div class="fold" onclick="go('find',{y:'${y}',k:'${k}'})"><small>FOLDER</small><b>${ic('folder')}/${y}/${k}/</b><span>${c} arsip</span></div>`).join('')}</div>
<h4>Arsip Terbaru</h4><div class="tw"><table><thead><tr><th>Nama</th><th>Kategori</th><th>Tanggal</th></tr></thead><tbody>${DB.slice(0,4).map(x=>`<tr class="r" onclick="view(${x.id})"><td>${ico(x)}${esc(x.nm)}</td><td><span class="pill">${lab(x.kind)}</span></td><td class="mu">${x.dt}</td></tr>`).join('')}</tbody></table></div>`}

/* 1. Tambah Arsip: Koneksi Drive → Jenis → Detail → Folder → Simpan → Notifikasi */
const hd=(a,b,c)=>`<h1>Tambah Arsip Baru</h1><div class="rule"></div><div class="steps"><span class="${a}">1 Koneksi Drive</span><span class="${b}">2 Jenis</span><span class="${c}">3 Detail</span></div>`;
function addView(){kind='';
if(!SHARED_MODE&&!me.drive){$('add').innerHTML=hd('on','','')+accounts()+`<div class="card">${driveForm()}</div>`;return}
$('add').innerHTML=hd('','on','')+accounts()+`<div class="card"><b>Pilih jenis kegiatan</b><div class="seg">
<button onclick="pick('Pembangunan')"><b>${ic('build')}Pembangunan</b><span class="mu sm">Proyek &amp; progres 0–100%</span></button>
<button onclick="pick('Kegiatan_Sekolah')"><b>${ic('cap')}Kegiatan Sekolah</b><span class="mu sm">Acara &amp; dokumentasi</span></button></div></div>`}
function pick(k){kind=k;const p=k==='Pembangunan';
$('add').innerHTML=hd('','','on')+`<div class="card"><b>${p?'Detail Proyek & Foto Progres (0%–100%)':'Detail Acara & Foto Dokumentasi'}</b>
<label>${p?'Nama proyek':'Nama acara'}</label><input id="nm"><label>Tanggal</label><input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}" onchange="updPath()">
<label>Deskripsi</label><textarea id="ds" rows="2"></textarea>
${p?`<label>Progres: <span id="pv">0</span>%</label><input type="range" id="pr" min="0" max="100" step="5" value="0" oninput="pv.textContent=this.value">`:''}
<label>${p?'Foto progres':'Foto dokumentasi'}</label><input type="file" id="fo" accept="image/*" multiple>
<div class="path" id="path"></div>
<div class="row"><button class="btn" onclick="save()">${ic('save')}Simpan ke Drive &amp; Database</button><button class="btn gh" onclick="addView()">${ic('back')}Kembali</button></div></div>`;updPath()}
function updPath(){$('path').textContent=(SHARED_MODE?'Drive bersama sekolah':me.drive)+' › /'+($('dt').value||'Tahun').slice(0,4)+'/'+kind+'/'}
async function driveRequest(url,token,options){
const response=await fetch(url,{...options,headers:{Authorization:'Bearer '+token,...(options&&options.headers||{})}});
const result=await response.json().catch(()=>({}));
if(!response.ok)throw new Error(result.error&&result.error.message||`Google Drive menolak permintaan (${response.status}).`);
return result
}
async function findOrCreateFolder(name,parent,token){
const q=`name='${name.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`;
const query=new URLSearchParams({q,fields:'files(id,name)',pageSize:'1'});
const found=await driveRequest('https://www.googleapis.com/drive/v3/files?'+query,token);
if(found.files&&found.files.length)return found.files[0].id;
const folder=await driveRequest('https://www.googleapis.com/drive/v3/files?fields=id',token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parent]})});
return folder.id
}
async function uploadToDrive(file,parent,token){
const metadata={name:file.name,parents:[parent]},boundary='arsip_'+Math.random().toString(16).slice(2);
const body=new Blob(['--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',JSON.stringify(metadata),'\r\n--'+boundary+'\r\nContent-Type: '+(file.type||'application/octet-stream')+'\r\n\r\n',file,'\r\n--'+boundary+'--']);
return driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body})
}
async function save(){
const nm=$('nm').value.trim(),dt=$('dt').value;if(!nm||!dt)return toast('Nama & tanggal wajib diisi',1);
if(SHARED_MODE){saveSharedArchive(nm,dt);return}
const button=$('add').querySelector('.btn');if(button){button.disabled=true;button.textContent='Menyimpan…'}
try{
const account=await connectedGoogleAccount(false);
if(account.email!==me.drive)throw new Error(`Akun Google yang aktif (${account.email}) berbeda dari Drive penyimpanan (${me.drive}). Hubungkan akun yang benar di Pengaturan.`);
const fs=[...$('fo').files],root=await findOrCreateFolder('Arsip Sekolah','root',account.token);
const yearFolder=await findOrCreateFolder(yr(dt),root,account.token);
const categoryFolder=await findOrCreateFolder(kind==='Kegiatan_Sekolah'?'Kegiatan Sekolah':'Pembangunan',yearFolder,account.token);
const driveFiles=[];
for(const file of fs)driveFiles.push(await uploadToDrive(file,categoryFolder,account.token));
const id=Date.now();
DB.unshift({id,kind,nm,dt,ds:$('ds').value.trim(),pr:kind==='Pembangunan'?+$('pr').value:null,n:driveFiles.length,driveFiles});
if(!persist()){if(button){button.disabled=false;button.innerHTML=ic('save')+'Simpan ke Drive &amp; Database'}return}toast(fs.length?'Arsip dan foto berhasil disimpan ke Google Drive.':'Arsip berhasil disimpan.');go('dash')
}catch(e){console.error('Penyimpanan ke Google Drive gagal.',e);toast(e.message||'Gagal menyimpan ke Google Drive.',1);if(button){button.disabled=false;button.innerHTML=ic('save')+'Simpan ke Drive &amp; Database'}}
}
async function fileAsBase64(file){
return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:String(reader.result).split(',')[1]||''});reader.onerror=()=>reject(reader.error||new Error('Gagal membaca berkas.'));reader.readAsDataURL(file)})
}
async function saveSharedArchive(nm,dt){
const button=$('add').querySelector('.btn');if(button){button.disabled=true;button.textContent='Mengunggah ke Drive…'}
try{
const files=await Promise.all([...$('fo').files].map(fileAsBase64));
const record=await rpc('saveArchive',AUTH_TOKEN,{kind,nm,dt,ds:$('ds').value.trim(),pr:kind==='Pembangunan'?+$('pr').value:null,files});
DB.unshift(record);toast(files.length?'Arsip dan foto tersimpan di Drive bersama.':'Arsip tersimpan bersama.');go('dash')
}catch(e){console.error('Gagal menyimpan arsip bersama.',e);toast(e.message||'Gagal menyimpan arsip.',1);if(button){button.disabled=false;button.innerHTML=ic('save')+'Simpan ke Drive &amp; Database'}}
}

/* 2. Cari & Lihat */
function years(){const c=$('fy').value,ys=[...new Set(DB.map(x=>yr(x.dt)))].sort().reverse();
$('fy').innerHTML='<option value="">Semua tahun</option>'+ys.map(y=>`<option ${y===c?'selected':''}>${y}</option>`).join('')}
function rows(r){return r.length?r.map(x=>`<tr class="r" onclick="view(${x.id})"><td>${ico(x)}${esc(x.nm)}</td><td><span class="pill">${lab(x.kind)}</span></td><td class="mu">${x.dt}</td>
<td class="mu">${x.pr!=null?`<span class="bar"><i style="width:${x.pr}%"></i></span>${x.pr}%`:x.n+' foto'}</td></tr>`).join(''):'<tr><td colspan="4" class="mu">Tidak ada arsip yang cocok.</td></tr>'}
function render(){const y=$('fy').value,k=$('fc').value;$('tb').innerHTML=rows(DB.filter(x=>(!y||yr(x.dt)===y)&&(!k||x.kind===k)))}
function gsearch(){const q=$('gq').value.toLowerCase();go('find');$('tb').innerHTML=rows(DB.filter(x=>x.nm.toLowerCase().includes(q)))}
function view(id){const x=DB.find(a=>a.id===id);if(!x)return;
$('mb').innerHTML=`<span class="pill">${lab(x.kind)}</span><h2 style="margin:.5rem 0;color:var(--pr)">${esc(x.nm)}</h2><p class="mu sm">${x.dt} · ${x.n} foto</p><p>${esc(x.ds||'Tanpa deskripsi.')}</p>
${x.pr!=null?`<b>Progres ${x.pr}%</b><div style="height:8px;background:var(--bd);border-radius:8px;margin-top:.4rem;overflow:hidden"><i style="display:block;height:100%;width:${x.pr}%;background:var(--ok)"></i></div>`:''}
${x.driveFiles&&x.driveFiles.length?`<div style="display:grid;gap:.5rem;margin-top:1rem">${x.driveFiles.map(f=>`<a href="${esc(f.webViewLink||'https://drive.google.com/file/d/'+encodeURIComponent(f.id)+'/view')}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join('')}</div>`:''}
<div class="path">${esc(me.drive||'Drive belum terhubung')} › /${yr(x.dt)}/${x.kind}/</div>
<div class="row"><button class="btn gh" onclick="closeM()">Tutup</button></div>`;
$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide')}
let tt;function toast(m,e){const t=$('toast');t.innerHTML=ic(e?'x':'check')+esc(m);t.style.background=e?'#dc2626':'';t.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hide'),5000)}
function rpc(method,...args){
return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))
}
async function initSharedApp(){
$('auth').innerHTML='<div class="box"><div class="brand">Arsip Sekolah</div><p class="mu sm">Masuk dengan akun Google yang sudah diizinkan admin untuk membuka arsip bersama.</p><div id="googleSignIn"></div><p class="mu sm" id="sharedStatus">Memuat login Google…</p></div>';
let attempts=0;
const waitForGoogle=()=>{
if(window.google&&google.accounts&&google.accounts.id){
rpc('getClientConfig').then(config=>{
google.accounts.id.initialize({client_id:config.clientId,callback:completeSharedSignIn,auto_select:false});
google.accounts.id.renderButton($('googleSignIn'),{theme:'outline',size:'large',text:'signin_with',locale:'id'})
}).catch(e=>{const status=$('sharedStatus');if(status)status.textContent=e.message||'Konfigurasi aplikasi belum siap.'});
return
}
if(++attempts<40)return setTimeout(waitForGoogle,250);
const status=$('sharedStatus');if(status)status.textContent='Layanan login Google tidak termuat. Periksa koneksi internet lalu muat ulang halaman.'
};
waitForGoogle()
}
async function completeSharedSignIn(response){
AUTH_TOKEN=response.credential;
const status=$('sharedStatus');if(status)status.textContent='Memeriksa akun sekolah…';
try{
const data=await rpc('getBootstrapData',AUTH_TOKEN);
DB=data.archives;CONFIG.adminEmail=data.adminEmail;CONFIG.authorizedEmails=data.authorizedEmails;me={email:data.email,name:data.email,isAdmin:data.isAdmin,drive:'Drive bersama sekolah'};
$('who').textContent=me.email;$('av').textContent=me.email[0].toUpperCase();$('auth').classList.add('hide');$('app').classList.remove('hide');go('dash')
}catch(e){
console.error('Gagal membuka aplikasi bersama.',e);
const message=document.getElementById('sharedStatus');if(message)message.textContent=e.message||'Tidak dapat mengakses aplikasi. Pastikan akun Google Anda sudah diizinkan admin.';
}
}
if(SHARED_MODE)initSharedApp();
