</main></div>

async function saveSharedSettings(){
const loginUsername=$('sharedUsername').value.trim().toLowerCase();
if(!/^[a-z0-9._-]{3,32}$/.test(loginUsername))return toast('Username harus 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda hubung.',1);
try{
const result=await request('updateSharedSettings',{settings:{loginUsername,authorizedEmails:CONFIG.authorizedEmails||[]}});
CONFIG.loginUsername=result.loginUsername;me.username=result.loginUsername;
toast('Username berhasil diperbarui.');settingsView()
}catch(e){toast(e.message||'Gagal memperbarui username.',1)}
}
async function saveDriveViewers(){

async function changeSharedPassword(){
const currentPassword=$('currentPassword').value,newPassword=$('newPassword').value;
if(!currentPassword||newPassword.length<8)return toast('Masukkan password saat ini dan password baru minimal 8 karakter.',1);
const user=fbAuth&&fbAuth.currentUser;
if(!user)return toast('Sesi login tidak tersedia. Masuk kembali.',1);
try{
const credential=firebase.auth.EmailAuthProvider.credential(user.email,currentPassword);
await user.reauthenticateWithCredential(credential);
await user.updatePassword(newPassword);
$('currentPassword').value='';$('newPassword').value='';
toast('Password bersama berhasil diubah. Semua pengguna harus memakai password baru saat login berikutnya.')
}catch(e){console.error('Gagal mengubah password bersama.',e);toast(e.message||'Gagal mengubah password.',1)}
}

async function save(){
const nm=$('nm').value.trim(),dt=$('dt').value;if(!nm||!dt)return toast('Nama & tanggal wajib diisi',1);
const parsedDate=new Date(dt+'T00:00:00Z');
if(nm.length>200||$('ds').value.trim().length>5000)return toast('Nama maksimal 200 karakter dan deskripsi maksimal 5.000 karakter.',1);
if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||isNaN(parsedDate.getTime())||parsedDate.toISOString().slice(0,10)!==dt)return toast('Tanggal tidak valid.',1);
const progress=kind==='Pembangunan'?Number($('pr').value):null;
if(kind==='Pembangunan'&&(!Number.isInteger(progress)||progress<0||progress>100))return toast('Progres harus 0–100%.',1);
const files=[...$('fo').files];
if(files.length>10||files.reduce((n,f)=>n+f.size,0)>10*1024*1024)return toast('Maksimal 10 berkas dan total ukuran 10 MB.',1);
if(files.some(f=>!['image/jpeg','image/png','image/gif','image/webp','application/pdf'].includes(f.type)))return toast('Tipe berkas tidak diizinkan.',1);
const oldRecord=editingId&&DB.find(item=>item.id===editingId),removeIds=[...document.querySelectorAll('.remove-old-file:checked')].map(input=>input.value);
if(editingId&&!oldRecord)return toast('Arsip yang akan diedit tidak ditemukan. Muat ulang data lalu coba lagi.',1);
const retained=oldRecord?fileList(oldRecord).filter(file=>!removeIds.includes(String(file.id))):[];
if(retained.length+files.length>10)return toast('Maksimal 10 berkas per arsip. Hapus berkas lama sebelum menambah berkas baru.',1);
await saveSharedArchive(nm,dt,files,progress,retained,removeIds)
}
async function fileAsBase64(file){
return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:String(reader.result).split(',')[1]||''});reader.onerror=()=>reject(reader.error||new Error('Gagal membaca berkas.'));reader.readAsDataURL(file)})
}
async function saveSharedArchive(nm,dt,selectedFiles,progress,retainedFiles,removedFileIds){
const button=$('add').querySelector('.btn');if(button){button.disabled=true;button.textContent='Mengunggah ke Drive…'}
let uploadedFiles=[];
let cleanupToken='';
try{
const files=await Promise.all(selectedFiles.map(fileAsBase64));
if(files.length){const uploadResult=await request('uploadArchiveFiles',{files,dt,kind});uploadedFiles=uploadResult.driveFiles||[];cleanupToken=uploadResult.cleanupToken||''}
const id=editingId||fbDb.ref(kind).push().key;
const record={id,kind,nm,dt,ds:$('ds').value.trim(),pr:kind==='Pembangunan'?progress:null,
driveFiles:retainedFiles.concat(uploadedFiles),n:retainedFiles.length+uploadedFiles.length,uploader:me.username};
await archiveRef(kind,id).set(record);
DB=DB.filter(item=>item.id!==id);DB.unshift(record);editingId=null;
let cleanupMessage='';
if(removedFileIds.length){try{await request('deleteDriveFiles',{fileIds:removedFileIds})}
catch(e){console.error('Metadata tersimpan, tetapi berkas Drive lama gagal dihapus.',e);cleanupMessage=' Metadata tersimpan, tetapi sebagian berkas lama gagal dihapus dari Drive: '+(e.message||'periksa izin Drive')}}
toast((files.length?'Arsip dan berkas tersimpan di Drive dan Firebase.':'Metadata arsip tersimpan di Firebase.')+cleanupMessage,!!cleanupMessage);go('dash')
}catch(e){
let cleanupMessage='';
if(uploadedFiles.length){try{await request('deleteDriveFiles',{fileIds:uploadedFiles.map(file=>file.id),cleanupToken})}
catch(cleanupError){console.error('Gagal membersihkan unggahan setelah penyimpanan metadata gagal.',cleanupError);cleanupMessage=' Berkas baru mungkin masih tersimpan di Drive.'}}
console.error('Gagal menyimpan arsip bersama.',e);toast((e.message||'Gagal menyimpan arsip.')+cleanupMessage,1);
if(button){button.disabled=false;button.innerHTML=ic('save')+(editingId?'Simpan perubahan':'Simpan ke Drive &amp; Firebase')}
}
}

function archiveRef(category,id){
if(!fbDb||!['Pembangunan','Kegiatan_Sekolah'].includes(category))throw new Error('Firebase Realtime Database belum siap atau kategori tidak valid.');
return fbDb.ref(category+'/'+id)
}
function normalizeArchive(id,category,raw){
const files=Array.isArray(raw&&raw.driveFiles)?raw.driveFiles:
raw&&raw.driveFiles&&typeof raw.driveFiles==='object'?Object.keys(raw.driveFiles).map(key=>raw.driveFiles[key]):[];
return {id:String(id),kind:category,nm:String(raw&&raw.nm||''),dt:String(raw&&raw.dt||''),
ds:String(raw&&raw.ds||''),pr:category==='Pembangunan'&&raw&&raw.pr!=null?Number(raw.pr):null,
driveFiles:files.filter(file=>file&&file.id),n:files.filter(file=>file&&file.id).length,
uploader:String(raw&&raw.uploader||'')};
}
async function loadFirebaseArchives(){
const results=await Promise.all(['Pembangunan','Kegiatan_Sekolah'].map(async category=>{
const snapshot=await fbDb.ref(category).once('value'),value=snapshot.val()||{};
return Object.keys(value).map(id=>normalizeArchive(id,category,value[id]));
}));
return results[0].concat(results[1]).sort((a,b)=>b.dt.localeCompare(a.dt));
}
async function migrateLegacyArchives(legacy){
if(!Array.isArray(legacy)||!legacy.length)return loadFirebaseArchives();
for(const item of legacy){
if(!item||!item.id||!['Pembangunan','Kegiatan_Sekolah'].includes(item.kind))continue;
const record=normalizeArchive(item.id,item.kind,item);
await archiveRef(item.kind,item.id).transaction(value=>value===null?record:undefined);
}
return loadFirebaseArchives();
}

function rpc(method,...args){
return new Promise((resolve,reject)=>{
if(!window.google||!google.script||!google.script.run)return reject(new Error('Google Apps Script bridge tidak tersedia.'));
google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args)
})
}
async function postApi(payload){
if(!CONFIG.apiUrl)throw new Error('URL Web App Apps Script belum dipasang di window.ARSIP_CONFIG.');
let response;
try{
response=await fetch(CONFIG.apiUrl,{
method:'POST',
headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
body:new URLSearchParams({request:JSON.stringify(payload)}),
redirect:'follow',
credentials:'omit',
cache:'no-store'
});
}catch(error){
console.warn('POST langsung gagal, mencoba bridge iframe.',error);
}
if(response){
const text=await response.text();
let result;
try{result=JSON.parse(text)}catch(error){
throw new Error('Respons backend bukan JSON. Periksa deployment Apps Script.');
}
if(!result||!result.ok)throw new Error(result&&result.error||'Permintaan ke backend gagal.');
return result.result;
}
const nonce=window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const frame=document.createElement('iframe'),form=document.createElement('form');
frame.name='arsip-api-'+nonce;frame.style.display='none';frame.setAttribute('aria-hidden','true');
form.method='POST';form.action=CONFIG.apiUrl;form.target=frame.name;form.style.display='none';
const field=document.createElement('input');field.type='hidden';field.name='request';
field.value=JSON.stringify({...payload,bridge:{nonce,origin:location.origin}});
form.appendChild(field);document.body.append(frame,form);
return new Promise((resolve,reject)=>{
let timer;
const cleanup=()=>{clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove()};
const receive=event=>{
if(event.source!==frame.contentWindow||!event.data||event.data.nonce!==nonce)return;
cleanup();const result=event.data.response;
if(!result||!result.ok)reject(new Error(result&&result.error||'Permintaan ke backend gagal.'));
else resolve(result.result)
};
window.addEventListener('message',receive);
timer=setTimeout(()=>{cleanup();reject(new Error('Backend tidak merespons. Periksa deployment dan ALLOWED_ORIGINS.'))},120000);
form.submit()
})
}
async function request(action,payload={}){
if(action!=='getLoginConfig'&&fbAuth&&fbAuth.currentUser)AUTH_TOKEN=await fbAuth.currentUser.getIdToken();
if(SHARED_MODE){
const args={
getLoginConfig:[],
getBootstrapData:[AUTH_TOKEN],getArchives:[AUTH_TOKEN],
uploadArchiveFiles:[AUTH_TOKEN,payload.files,payload.dt,payload.kind],
deleteDriveFiles:[AUTH_TOKEN,payload.fileIds].concat(payload.cleanupToken?[payload.cleanupToken]:[]),
getUserPermissions:[AUTH_TOKEN],
updateSharedSettings:[AUTH_TOKEN,payload.settings]
}[action];
if(!args)throw new Error('Aksi backend tidak dikenal.');
return rpc(action,...args)
}
return postApi({action,idToken:AUTH_TOKEN,...payload})
}

async function initializeSignIn(){
const fc=CONFIG.firebaseConfig||{},firebaseReady=['apiKey','authDomain','databaseURL','projectId','appId'].every(key=>fc[key]&&!String(fc[key]).includes('YOUR_'));
if((!SHARED_MODE&&(!CONFIG.apiUrl||String(CONFIG.apiUrl).includes('YOUR_')))||!firebaseReady){
$('sharedStatus').textContent='Konfigurasi belum lengkap: periksa URL Web App dan Firebase config.';
return
}
if(!window.firebase){$('sharedStatus').textContent='Firebase SDK belum termuat. Periksa koneksi lalu muat ulang.';return}
try{
if(!firebase.apps.length)firebase.initializeApp(fc);
fbAuth=firebase.auth();fbDb=firebase.database();
LOGIN_CONFIG=await request('getLoginConfig');
if(!LOGIN_CONFIG.ready)throw new Error('Login belum dikonfigurasi. Periksa Script Properties dan Firebase Authentication.');
$('loginUsername').placeholder='Username';
fbAuth.onAuthStateChanged(async user=>{
if(!user)return;
const status=$('sharedStatus');if(status)status.textContent='Memuat data arsip…';
try{await establishSignedIn(user)}
catch(e){
console.error('Sesi akun bersama tidak valid.',e);
await fbAuth.signOut();
if(status)status.textContent=e.message||'Sesi login tidak valid. Masuk kembali.';
const button=$('loginButton');if(button){button.disabled=false;button.textContent='Masuk'}
}
});
}catch(e){console.error('Gagal menginisialisasi login bersama.',e);$('sharedStatus').textContent=e.message||'Inisialisasi login gagal.'}
}
window.addEventListener('load',initializeSignIn);
</script></body></html>
